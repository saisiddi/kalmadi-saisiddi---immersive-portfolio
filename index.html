<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="Kalmadi Saisiddi - Creative Front-End Developer & Cybersecurity Student. Building immersive digital experiences.">
  <meta name="theme-color" content="#050505">
  <title>Kalmadi Saisiddi | Creative Developer</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;800&family=JetBrains+Mono:wght@400;500&family=Manrope:wght@200;300;400;600;800&display=swap"
    rel="stylesheet">

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            background: '#050505',
            surface: '#0a0a0a',
            primary: '#FFFFFF',
            secondary: '#A1A1AA',
            accent: '#22c55e',
          },
          fontFamily: {
            sans: ['Manrope', 'Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          backgroundImage: {
            'gradient-radial': 'radial-gradient(var(--tw-gradient-stops))',
          },
          animation: {
            'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'float': 'float 6s ease-in-out infinite',
          },
          keyframes: {
            float: {
              '0%, 100%': { transform: 'translateY(0px)' },
              '50%': { transform: 'translateY(-20px)' },
            }
          }
        }
      }
    }
  </script>

  <style>
    /* Base Styles */
    * {
      cursor: none;
    }

    html {
      scroll-behavior: auto;
    }

    body {
      background-color: #050505;
      color: #ffffff;
      overflow-x: hidden;
    }

    /* Lenis Smooth Scroll */
    html.lenis,
    html.lenis body {
      height: auto;
    }

    .lenis.lenis-smooth {
      scroll-behavior: auto !important;
    }

    .lenis.lenis-smooth [data-lenis-prevent] {
      overscroll-behavior: contain;
    }

    .lenis.lenis-stopped {
      overflow: hidden;
    }

    .lenis.lenis-scrolling iframe {
      pointer-events: none;
    }

    /* Selection */
    ::selection {
      background: #22c55e;
      color: #000000;
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: #050505;
    }

    ::-webkit-scrollbar-thumb {
      background: #1a1a1a;
      border-radius: 6px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #22c55e;
    }

    /* Mobile: Restore default cursor */
    @media (max-width: 768px) {
      * {
        cursor: auto;
      }
    }
  </style>

  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "framer-motion": "https://esm.sh/framer-motion@^12.24.12",
    "@react-three/fiber": "https://esm.sh/@react-three/fiber@^9.5.0?external=three",
    "@react-three/drei": "https://esm.sh/@react-three/drei@^10.7.7?external=three",
    "lenis": "https://esm.sh/lenis@^1.3.17",
    "three": "https://esm.sh/three@^0.182.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "gsap": "https://esm.sh/gsap@^3.12.5",
    "gsap/ScrollTrigger": "https://esm.sh/gsap@^3.12.5/ScrollTrigger",
    "@gsap/react": "https://esm.sh/@gsap/react@^2.1.1"
  }
}
</script>
  <link rel="stylesheet" href="/index.css">
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
